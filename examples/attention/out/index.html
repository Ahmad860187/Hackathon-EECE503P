<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Paper to Playground</title>
<style>
/* Paper to Playground - shell styles. System fonts only, no external resources. */
:root {
  color-scheme: light;
  --bg: #f6f5f1;
  --card: #ffffff;
  --surface2: #f0efea;
  --text: #1d2125;
  --muted: #59626b;
  --faint: #677079;
  --border: #dcdcd5;
  --grid: #e7e7e1;
  --axis: #8f979e;
  --accent: #b83c0a;
  --accent-soft: rgba(184, 60, 10, 0.12);
  --ghost: #9aa2a9;
  --seq: #2b6cb0;
  --pos: #2b6cb0;
  --neg: #9c36b5;
  --on-strong: #ffffff;
  --empty: #e9e9e3;
  --ok: #2a7046;
  --ok-soft: rgba(42, 112, 70, 0.12);
  --bad: #c0392b;
  --bad-soft: rgba(192, 57, 43, 0.12);
  --link: #1f5fa8;
  --c0: #2b6cb0;
  --c1: #1d7a6f;
  --c2: #7048b6;
  --c3: #4d7a17;
  --c4: #b83280;
  --c5: #4a5f6d;
  --c6: #8a6a3b;
  --c7: #4c51bf;
  --shadow: 0 1px 2px rgba(20, 24, 28, 0.05), 0 2px 10px rgba(20, 24, 28, 0.04);
  --shadow-raised: 0 1px 2px rgba(20, 24, 28, 0.06), 0 6px 24px -4px rgba(20, 24, 28, 0.10);
  --edge: rgba(20, 24, 28, 0.10);
  --bar-h: 50px;
  --on-l: #ffffff; --on-d: #1d2125; --halo-cell: rgba(255, 255, 255, 0.45); --halo-on-d: rgba(255, 255, 255, 0.45); --halo-on-l: rgba(8, 16, 32, 0.3);
  --radius: 12px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, Cambria, "Times New Roman", serif;
  --math: "Cambria Math", "STIX Two Math", "Latin Modern Math", Cambria, Georgia, serif;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #14171b; --card: #1c2025; --surface2: #23282e; --text: #e6e8eb; --muted: #a4acb5; --faint: #8f98a1;
    --border: #343b43; --grid: #2a3037; --axis: #6f7882; --accent: #ff7a3d; --accent-soft: rgba(255, 122, 61, 0.16);
    --ghost: #7c858f; --seq: #5ea1ff; --pos: #5ea1ff; --neg: #cf8af0; --on-strong: #0c1118; --empty: #2a2f35;
    --ok: #6cd39a; --ok-soft: rgba(108, 211, 154, 0.13); --bad: #ff8a80; --bad-soft: rgba(255, 138, 128, 0.13); --link: #7db4ff;
    --c0: #5ea1ff; --c1: #4fd1c5; --c2: #a78bfa; --c3: #9ccc65; --c4: #f06fb3; --c5: #9fb3c8; --c6: #d4b483; --c7: #8c9eff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-raised: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 28px -6px rgba(0, 0, 0, 0.55); --edge: rgba(0, 0, 0, 0.45);
    --on-l: #0c1118; --on-d: #0c1118; --halo-cell: rgba(0, 0, 0, 0.42); --halo-on-d: rgba(255, 255, 255, 0.32); --halo-on-l: rgba(255, 255, 255, 0.32);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14171b; --card: #1c2025; --surface2: #23282e; --text: #e6e8eb; --muted: #a4acb5; --faint: #8f98a1;
  --border: #343b43; --grid: #2a3037; --axis: #6f7882; --accent: #ff7a3d; --accent-soft: rgba(255, 122, 61, 0.16);
  --ghost: #7c858f; --seq: #5ea1ff; --pos: #5ea1ff; --neg: #cf8af0; --on-strong: #0c1118; --empty: #2a2f35;
  --ok: #6cd39a; --ok-soft: rgba(108, 211, 154, 0.13); --bad: #ff8a80; --bad-soft: rgba(255, 138, 128, 0.13); --link: #7db4ff;
  --c0: #5ea1ff; --c1: #4fd1c5; --c2: #a78bfa; --c3: #9ccc65; --c4: #f06fb3; --c5: #9fb3c8; --c6: #d4b483; --c7: #8c9eff;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-raised: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 28px -6px rgba(0, 0, 0, 0.55); --edge: rgba(0, 0, 0, 0.45);
  --on-l: #0c1118; --on-d: #0c1118; --halo-cell: rgba(0, 0, 0, 0.42); --halo-on-d: rgba(255, 255, 255, 0.32); --halo-on-l: rgba(255, 255, 255, 0.32);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 var(--sans); overflow-x: hidden;
}
a { color: var(--link); overflow-wrap: anywhere; }
h1, h2, h3 { font-family: var(--serif); line-height: 1.25; margin: 0 0 0.5em; font-weight: 600; text-wrap: balance; }
/* size-specific tracking: large display type tightens, text sizes stay near 0 */
h1 { font-size: clamp(1.7rem, 4.4vw, 2.5rem); line-height: 1.12; letter-spacing: -0.022em; font-weight: 700; }
h2 { font-size: 1.45rem; line-height: 1.22; letter-spacing: -0.012em; }
h3 { font-size: 1.1rem; line-height: 1.3; letter-spacing: -0.004em; }
p { margin: 0 0 0.75em; text-wrap: pretty; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--c0); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

/* header */
.site-head { padding-top: 32px; padding-bottom: 6px; }
.eyebrow { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.cite-line { color: var(--muted); font-size: 0.98rem; margin-bottom: 0; }
.cite-line em { font-style: italic; }
.toc-bar { position: sticky; top: 0; z-index: 30; margin-top: 10px; background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(10px); backdrop-filter: saturate(1.6) blur(10px); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .toc-bar { background: var(--bg); } }
/* soft scroll-edge shadow instead of a hard divider; only once content passes beneath */
.toc-bar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 10px; pointer-events: none; background: linear-gradient(var(--edge), transparent); opacity: 0; transition: opacity 200ms ease-out; }
.toc-bar.stuck::after { opacity: 1; }
.toc { display: flex; flex-wrap: nowrap; gap: 6px; margin: 0; padding: 8px 0; list-style: none; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
.toc::-webkit-scrollbar { display: none; }
.toc li { flex: none; }
.toc a { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 12px; border: 1px solid var(--border); border-radius: 999px; text-decoration: none; color: var(--text); font-size: 0.88rem; background: var(--card); white-space: nowrap; transition-property: transform, border-color, box-shadow; transition-duration: 160ms; transition-timing-function: ease-out; }
.toc a:hover { border-color: var(--c0); }
.toc a.cur { border-color: var(--c0); box-shadow: inset 0 0 0 1px var(--c0); font-weight: 600; }
.theme-btn { border: 1px solid var(--border); background: var(--card); border-radius: 999px; padding: 4px 12px; min-height: 30px; font-size: 0.78rem; cursor: pointer; letter-spacing: 0.02em; text-transform: none; color: var(--muted); transition: transform 160ms ease-out; }

/* sections */
.section { margin: 34px 0; scroll-margin-top: calc(var(--bar-h) + 10px); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.section > h2 { display: flex; align-items: baseline; gap: 10px; margin-bottom: 0.6em; }
.section > h2 .num { font-family: var(--sans); font-size: 0.8rem; color: var(--muted); font-weight: 600; border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
.lead { font-size: 1.08rem; }
.why { border-left: 3px solid var(--c0); padding: 2px 0 2px 12px; color: var(--text); margin-top: 10px; }
.why strong { color: var(--muted); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; display: block; }
.two { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 860px) { .two { grid-template-columns: 1fr 1fr; } }

/* symbols + equations */
.sym-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.sym-table th, .sym-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.sym-table th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.sym { font-family: var(--math); font-style: italic; font-size: 1.08rem; white-space: nowrap; }
.eq { margin: 0 0 14px; }
.eq-label { font-size: 0.85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.eq-expr { font-family: var(--math); font-size: 1.15rem; padding: 8px 12px; background: var(--surface2); border-radius: 8px; overflow-x: auto; margin-top: 4px; }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.74rem; line-height: 1.3; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); white-space: normal; }
.badge-excerpt { border-color: color-mix(in srgb, var(--ok) 45%, var(--border)); color: var(--ok); background: var(--ok-soft); }
.badge-paper { border-color: color-mix(in srgb, var(--c0) 40%, var(--border)); color: var(--c0); }
.badge-illustration { border-color: color-mix(in srgb, var(--c2) 40%, var(--border)); color: var(--c2); }

/* playground */
.play { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 900px) { .play { grid-template-columns: minmax(0, 1fr) minmax(290px, 340px); } }
@media (min-width: 900px) and (min-height: 560px) {
  /* controls + live values stay in view while the learner scans a tall visual */
  .side { position: sticky; top: calc(var(--bar-h) + 12px); max-height: calc(100vh - var(--bar-h) - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; padding-bottom: 2px; }
}
.viz-card { position: relative; scroll-margin-top: calc(var(--bar-h) + 10px); box-shadow: var(--shadow-raised); }
.viz-card.pulse { animation: pulse 1.6s ease-out; }
@keyframes pulse { 0%, 35% { box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-raised); border-color: var(--accent); } 100% { box-shadow: 0 0 0 14px transparent, var(--shadow-raised); } }
.establish { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--grid); }
.establish .caption { font-weight: 600; margin: 0 0 4px; font-size: 1.06rem; line-height: 1.4; }
.establish .howto { color: var(--muted); font-size: 0.93rem; margin: 0 0 2px; }
.establish .howto.meta { font-size: 0.82rem; }
.establish .howto b { color: var(--text); font-weight: 600; }
.watch-chip { display: none; align-items: center; gap: 8px; margin: 8px 0 4px; padding: 4px 6px 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--text); border: 1px solid var(--accent); font-size: 0.9rem; max-width: 100%; }
.watch-chip.on { display: inline-flex; }
.watch-chip .wv { font-family: var(--mono); font-weight: 600; color: var(--accent); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.watch-chip button { border: 0; background: transparent; cursor: pointer; color: var(--muted); min-width: 28px; min-height: 28px; font-size: 1.05rem; line-height: 1; border-radius: 999px; }
.watch-chip button:hover { background: var(--card); color: var(--text); }
/* panels flow in rows: full-width charts take a row; compact (natural-size) matrices,
   grids and vector plots sit side by side when they fit, so steps can be compared */
.viz, .kit-tl-frame, .kit-cmp-body { min-height: 0; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 20px; }
.viz { min-height: 120px; }
.viz > *, .kit-tl-frame > *, .kit-cmp-body > * { flex: 0 0 100%; min-width: 0; max-width: 100%; }
.viz > svg.kit-svg:not([width="100%"]), .kit-tl-frame > svg.kit-svg:not([width="100%"]), .kit-cmp-body > svg.kit-svg:not([width="100%"]) { flex: 0 1 auto; }
.viz-error { display: none; border: 1px solid var(--bad); background: var(--bad-soft); color: var(--text); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.93rem; overflow-wrap: anywhere; }
.viz-error.on { display: block; }
.viz-error code { font-family: var(--mono); font-size: 0.85rem; }
.side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.side .card { padding: 14px 16px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.card-head h3 { margin: 0; font-family: var(--sans); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--card); padding: 7px 15px; min-height: 38px; border-radius: 8px; cursor: pointer; font-size: 0.92rem; font-weight: 500; transition-property: transform, background-color, border-color, filter; transition-duration: 150ms; transition-timing-function: ease-out; }
.btn:hover { border-color: var(--c0); }
.btn, .kit-btn, .theme-btn, .toc a { touch-action: manipulation; }
/* feedback on pointer-down is instant; only the release eases back */
.btn:active, .kit-btn:active, .theme-btn:active, .toc a:active { transform: scale(0.97); transition-duration: 0s; }
.btn-primary.done { background: var(--ok); border-color: var(--ok); }
.btn-primary { background: var(--c0); border-color: var(--c0); color: #fff; }
:root[data-theme="dark"] .btn-primary { color: #0c1118; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primary { color: #0c1118; } }
.btn-primary:hover { filter: brightness(1.08); }
.btn-small { padding: 3px 12px; min-height: 32px; font-size: 0.84rem; }

/* controls */
.ctl { padding: 10px 6px; margin: 0 -6px; border-bottom: 1px solid var(--grid); border-radius: 6px; }
.ctl:last-child { border-bottom: 0; }
.ctl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ctl label, .ctl .ctl-label { font-weight: 600; font-size: 0.95rem; }
.ctl output { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.92rem; font-weight: 600; background: var(--surface2); padding: 1px 8px; border-radius: 6px; min-width: 3.5em; text-align: right; }
.ctl input[type="range"] { width: 100%; margin: 8px 0 0; accent-color: var(--c0); height: 24px; }
.ctl-scale { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--faint); font-family: var(--mono); }
.ctl-help { font-size: 0.84rem; color: var(--muted); margin: 4px 0 0; }
.ctl input[type="number"], .ctl select { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); margin-top: 6px; }
.ctl select { cursor: pointer; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { width: 20px; height: 20px; accent-color: var(--c0); margin: 0; flex: none; }
.cells-edit { display: grid; gap: 4px; margin-top: 6px; overflow-x: auto; padding-bottom: 2px; }
.cells-edit input { width: 100%; min-width: 3.6em; padding: 4px 4px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); font-family: var(--mono); font-size: 0.85rem; text-align: center; margin: 0; }
.cells-edit .ce-h { font-size: 0.72rem; color: var(--faint); text-align: center; font-family: var(--mono); align-self: end; }
.cells-edit .ce-r { font-size: 0.72rem; color: var(--faint); font-family: var(--mono); align-self: center; text-align: right; padding-right: 2px; }
.ctl-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* values table */
.vals { width: 100%; border-collapse: collapse; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
.vals td { padding: 5px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.vals tr:last-child td { border-bottom: 0; }
.vals td.v { font-family: var(--mono); font-weight: 600; text-align: right; white-space: nowrap; overflow-wrap: anywhere; word-break: break-word; max-width: 14em; }
.vals td.v.long { text-align: left; font-size: 0.8rem; font-weight: 500; white-space: normal; }
.vals .unit { color: var(--muted); font-size: 0.82rem; margin-left: 3px; font-family: var(--sans); }
.vals .delta { display: inline-block; width: 1em; font-size: 0.75rem; color: var(--muted); text-align: center; }
.vals tr.watched td { background: var(--accent-soft); }
.vals tr.watched td:first-child { box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
.vals tr.watched td.v { color: var(--accent); font-weight: 600; }
.flash { animation: flash 0.9s ease-out; }
@keyframes flash { 0% { background-color: var(--accent-soft); } 100% { background-color: transparent; } }
.vals tr.watched td.flash { animation: none; }
.live-eq { margin: 0 0 10px; }
.live-eq:last-child { margin-bottom: 0; }
.live-eq .lab { font-size: 0.8rem; color: var(--muted); }
.live-eq .expr { font-family: var(--math); font-size: 1.05rem; background: var(--surface2); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; line-height: 1.5; }
.live-eq .lv { font-weight: 700; font-variant-numeric: tabular-nums; }
.live-eq .lv-watch { color: var(--accent); }
.live-eq .lv-miss { color: var(--faint); font-weight: 400; }

/* explorations */
.explore-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 860px) { .explore-grid { grid-template-columns: 1fr 1fr; } }
.ex { display: flex; flex-direction: column; gap: 10px; border-top: 3px solid var(--c0); }
.ex.active { border-top-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-raised); }
.ex .ex-num { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.ex h3 { margin: 0; }
.ex .predict { background: var(--surface2); border-radius: 8px; padding: 10px 12px; margin: 0; }
.ex .predict b { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.ex .guess { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
.ex .guess input { padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font-size: 0.95rem; }
.ex .preset { font-size: 0.85rem; color: var(--muted); margin: 0; }
.ex .preset code { font-family: var(--mono); color: var(--text); background: var(--surface2); padding: 0 4px; border-radius: 4px; overflow-wrap: anywhere; }
.ex .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ex .status { font-size: 0.88rem; color: var(--text); margin: 0; min-height: 0; }
.ex .status:not(:empty) { padding: 6px 10px; border-radius: 8px; background: var(--accent-soft); border-left: 3px solid var(--accent); }
.ex .reveal { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; }
.ex .reveal[hidden] { display: none; }
.ex .reveal p b { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

/* limitation */
.limit { border-left: 4px solid var(--c6); }
.limit .kind { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--c6); font-weight: 700; margin-bottom: 4px; }

/* source & grounding */
.cite { font-family: var(--serif); font-size: 1.05rem; }
.claims { list-style: none; margin: 0; padding: 0; }
.claims li { padding: 8px 0; border-bottom: 1px solid var(--grid); display: flex; flex-direction: column; gap: 4px; }
.claims li:last-child { border-bottom: 0; }
.origin-note { font-size: 0.9rem; color: var(--muted); background: var(--surface2); border-radius: 8px; padding: 8px 12px; }
.legend-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

/* checks */
.checks { list-style: none; padding: 0; margin: 0; }
.checks li { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 0.93rem; }
.checks li:last-child { border-bottom: 0; }
.mark { flex: none; width: 1.5em; height: 1.5em; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
.mark.ok { color: var(--ok); background: var(--ok-soft); }
.mark.bad { color: var(--bad); background: var(--bad-soft); }
.mark.skip { color: var(--muted); background: var(--surface2); }

function compute(p) {

    dk: dk,

<script>
function render(r, p, kit, el) {

    title: "Scores S = Q Kᵀ (rows = queries, cols = keys)",
    data: r.Sraw,

    colLabels: ["k0", "k1", "k2"],

    title: "Weights A = softmax(S / √d_k) — each row sums to 1",
    data: r.A,

    colLabels: ["k0", "k1", "k2"],
    fmt: 3,
    scale: "seq",
    highlight: [[0, r.A[0].indexOf(r.maxWeight0)]]

  // ---- Panel 3: output O = A V, with the V rows it averages ----

      { title: "Weights A (row 0)", kind: "vector", data: r.A[0], caption: "row 0 of A" },
      { title: "Output O = A V", kind: "text", data: oRows, caption: "one row per query" }

  const blend = r.O[0].map((v, c) => r.A[0].reduce((s, w, j) => s + w * r.V[j][c], 0));

    "; O[0] = Σⱼ A[0][j]·V[j] = [" + blend.map(x => fmt(x, 3)).join(", ") + "]" +
    (blendOk ? " ✓" : " ✗") +

    if (paper.title) cite.push(h('em', { text: paper.title }));
    var who = [str(paper.authors), paper.year ? '(' + str(paper.year) + ')' : ''].filter(Boolean).join(' ');
    if (who) cite.push((cite.length ? ' — ' : '') + who);
    if (paper.section) cite.push(' · ' + str(paper.section));
    var toc = h('ul', { 'class': 'toc' });
    var head = h('header', { 'class': 'site-head wrap' }, [
      h('div', { 'class': 'eyebrow' }, [h('span', { text: 'Paper to Playground · interactive explainer' }), themeBtn]),
      h('h1', { text: str(S.title) || 'Interactive explainer' }),
      cite.length ? h('p', { 'class': 'cite-line' }, ['Based on '].concat(cite)) : null
    ]);
    /* section nav lives in its own full-width bar so it can stay pinned while reading */
    var bar = h('div', { 'class': 'toc-bar' }, h('nav', { 'class': 'wrap', 'aria-label': 'Sections' }, toc));
    return { el: head, bar: bar, toc: toc };
  }

  function buildIdea() {
    var body = h('div', { 'class': 'card' }, [
      S.idea ? h('p', { 'class': 'lead', text: S.idea }) : h('p', { 'class': 'lead', text: 'No summary was provided.' }),
      S.why ? h('div', { 'class': 'why' }, [h('strong', { text: 'Why it matters' }), h('span', { text: S.why })]) : null
    ]);
    return section('idea', 'The idea', [body]);
  }

  function buildNotation() {
    var syms = arr(S.symbols).filter(function (s) { return s && (s.sym || s.meaning); });
    var eqs = arr(S.equations).filter(function (e) { return e && (e.expr || e.label); });
    if (!syms.length && !eqs.length) return null;
    var parts = [];
    if (eqs.length) {
      parts.push(h('div', { 'class': 'card' }, [h('h3', { text: 'Key equation' + (eqs.length > 1 ? 's' : '') })].concat(eqs.map(function (e) {
        return h('div', { 'class': 'eq' }, [
          h('div', { 'class': 'eq-label' }, [h('span', { text: str(e.label) }), badge(e.support)]),
          e.expr ? h('div', { 'class': 'eq-expr', role: 'math', 'aria-label': str(e.expr), text: str(e.expr) }) : null
        ]);
      }))));
    }
    if (syms.length) {
      var tb = h('tbody');
      syms.forEach(function (s) {
        tb.append(h('tr', null, [h('td', { 'class': 'sym', text: str(s.sym) }), h('td', { text: str(s.meaning) + (s.unit ? ' (' + str(s.unit) + ')' : '') })]));
      });
      parts.push(h('div', { 'class': 'card' }, [h('h3', { text: 'Symbols' }),
        h('table', { 'class': 'sym-table' }, [h('thead', null, h('tr', null, [h('th', { scope: 'col', text: 'Symbol' }), h('th', { scope: 'col', text: 'Meaning' })])), tb])]));
    }
    return section('notation', 'Notation', [h('div', { 'class': parts.length > 1 ? 'two' : '' }, parts)]);
  }

  function buildPlayground() {
    var vis = (S.visual && typeof S.visual === 'object') ? S.visual : {};
    els.viz = h('div', { 'class': 'viz', id: 'viz', 'aria-live': 'off' });
    els.err = h('div', { 'class': 'viz-error', role: 'alert' });
    els.chipLabel = h('span');
    els.chipVal = h('span', { 'class': 'wv' });
    els.chip = h('div', { 'class': 'watch-chip', role: 'status' }, [
      h('span', { 'aria-hidden': 'true', text: '◉' }), h('span', null, [els.chipLabel, els.chipVal]),
      h('button', { type: 'button', 'aria-label': 'Stop highlighting', title: 'Stop highlighting', text: '×', onclick: function () { setWatch(null); run(); } })
    ]);
    var establish = h('div', { 'class': 'establish' }, [
      vis.caption ? h('p', { 'class': 'caption', text: vis.caption }) : null,
      vis.how_to_read ? h('p', { 'class': 'howto' }, [h('b', { text: 'How to read it: ' }), vis.how_to_read]) : null,
      h('p', { 'class': 'howto meta', text: 'Dashed grey shapes and ▲▼ marks show the state before your last change, so you can see what moved.' }),
      els.chip
    ]);
    els.vizCard = h('div', { 'class': 'card viz-card', id: 'visual', tabindex: '-1' }, [establish, els.err, els.viz]);

    var ctlBox = h('div', null, controls.map(buildControl));
    if (!controls.length) ctlBox.append(h('p', { 'class': 'ctl-help', text: 'This page has no adjustable inputs.' }));
    var resetBtn = h('button', { type: 'button', 'class': 'btn btn-small', text: '↺ Reset', 'aria-label': 'Reset all controls to their defaults', onclick: reset });
    var ctlCard = h('div', { 'class': 'card', id: 'controls' }, [h('div', { 'class': 'card-head' }, [h('h3', { text: 'Controls' }), resetBtn]), ctlBox]);

    els.vals = h('tbody');
    els.valsCard = h('div', { 'class': 'card', id: 'values' }, [
      h('div', { 'class': 'card-head' }, [h('h3', { text: 'Values (live)' })]),
      h('table', { 'class': 'vals', 'aria-label': 'Intermediate values' }, els.vals)
    ]);
    buildValueRows();

    var eqLive = arr(S.equations).filter(function (e) { return e && e.live; });
    var eqCard = null;
    if (eqLive.length) {
      eqCard = h('div', { 'class': 'card', id: 'live-equations' }, [h('div', { 'class': 'card-head' }, [h('h3', { text: 'Equations with current numbers' })])]);
      eqLive.forEach(function (e) {
        var ex = h('div', { 'class': 'expr' });
        eqCard.append(h('div', { 'class': 'live-eq' }, [e.label ? h('div', { 'class': 'lab', text: str(e.label) }) : null, ex]));
        liveEqs.push({ tpl: str(e.live), el: ex, prev: undefined });
      });
    }
    var side = h('div', { 'class': 'side' }, [ctlCard, els.valsCard, eqCard]);
    return section('playground', 'Playground', [h('div', { 'class': 'play' }, [els.vizCard, side])]);
  }

  var exCards = [];
  function describePreset(preset) {
    return Object.keys(preset || {}).map(function (k) {
      var c = byId[k];
      return (c ? c.label : k) + ' = ' + (c ? fmtVal(c, coerce(c, preset[k]) !== undefined ? coerce(c, preset[k]) : preset[k]) : fmt(preset[k], 3));
    }).join(', ');
  }
  function buildExplore() {
    var exs = arr(S.explorations).filter(function (e) { return e && typeof e === 'object'; });
    if (!exs.length) return null;
    var grid = h('div', { 'class': 'explore-grid' });
    exs.forEach(function (ex, i) {
      var preset = (ex.preset && typeof ex.preset === 'object') ? ex.preset : {};
      var revealId = 'reveal-' + i;
      var status = h('p', { 'class': 'status', role: 'status' });
      var reveal = h('div', { 'class': 'reveal', id: revealId, hidden: true }, [
        ex.observe ? h('p', null, [h('b', { text: 'What you should see' }), str(ex.observe)]) : null,
        ex.why ? h('p', null, [h('b', { text: 'Why' }), str(ex.why)]) : null
      ]);
      var whyBtn = h('button', { type: 'button', 'class': 'btn', 'aria-expanded': 'false', 'aria-controls': revealId, text: 'Show why' });
      whyBtn.addEventListener('click', function () {
        var open = reveal.hasAttribute('hidden');
        if (open) reveal.removeAttribute('hidden'); else reveal.setAttribute('hidden', '');
        whyBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        whyBtn.textContent = open ? 'Hide why' : 'Show why';
      });
      var card = h('article', { 'class': 'card ex', id: 'explore-' + (i + 1), 'aria-labelledby': 'ex-h-' + i });
      var tryBtn = h('button', { type: 'button', 'class': 'btn btn-primary', text: '▶ Try it' });
      tryBtn.addEventListener('click', function () { tryIt(ex, preset, card, status, tryBtn); });
      var desc = describePreset(preset);
      add(card, 
        h('div', { 'class': 'ex-num', text: 'Exploration ' + (i + 1) }),
        h('h3', { id: 'ex-h-' + i, text: str(ex.title) || 'What happens if…' }),
        h('p', { 'class': 'predict' }, [h('b', { text: 'Predict first' }), str(ex.predict)]),
        h('label', { 'class': 'guess' }, ['Your prediction (optional, stays on this page)', h('input', { type: 'text', autocomplete: 'off', id: 'guess-' + (i + 1), name: 'guess-' + (i + 1) })]),
        desc || ex.watch ? h('p', { 'class': 'preset' }, [
          desc ? 'Try it sets ' : null, desc ? h('code', { text: desc }) : null,
          desc ? ' (other controls return to their defaults).' : null,
          ex.watch ? (desc ? ' Then watch ' : 'Watch ') : null, ex.watch ? h('code', { text: labelFor(str(ex.watch)) }) : null, ex.watch ? '.' : null
        ]) : null,
        h('div', { 'class': 'actions' }, [tryBtn, whyBtn]),
        status, reveal
      );
      exCards.push(card);
      grid.append(card);
    });
    return section('explore', 'Explore', [grid]);
  }
  function tryIt(ex, preset, card, status, btn) {
    var before = clone(p);
    controls.forEach(function (c) { setControl(c.id, has(preset, c.id) ? clone(preset[c.id]) : clone(c.default)); });
    controls.forEach(function (c) {
      if (JSON.stringify(before[c.id]) !== JSON.stringify(p[c.id]) && widgets[c.id]) flash(widgets[c.id].el);
    });
    if (btn) {
      btn.textContent = '✓ Applied';
      btn.classList.add('done');
      clearTimeout(btn._t);
      btn._t = setTimeout(function () { btn.textContent = '▶ Try it again'; btn.classList.remove('done'); }, 1800);
    }
    Object.keys(preset).forEach(function (k) { if (!byId[k]) setControl(k, clone(preset[k])); });
    setWatch(ex.watch ? str(ex.watch) : null);
    exCards.forEach(function (cd) { cd.classList.toggle('active', cd === card); });
    status.textContent = ex.watch ? 'Applied. The orange highlight marks ' + labelFor(str(ex.watch)) + '. Compare it with your prediction, then press Show why.' : 'Applied. Compare the visual with your prediction, then press Show why.';
    try { els.vizCard.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); } catch (e) { els.vizCard.scrollIntoView(); }
    els.vizCard.classList.remove('pulse');
    void els.vizCard.offsetWidth;
    els.vizCard.classList.add('pulse');
  }
  function reset() {
    controls.forEach(function (c) { setControl(c.id, clone(c.default)); });
    setWatch(null);
    exCards.forEach(function (cd) { cd.classList.remove('active'); });
  }

  function buildLimitation() {
    var L = S.limitation;
    if (!L) return null;
    if (typeof L === 'string') L = { kind: 'limitation', text: L };
    if (!L.text) return null;
    var kinds = { limitation: 'Limitation', assumption: 'Assumption', misconception: 'Common misconception' };
    var k = str(L.kind).toLowerCase();
    return section('limitation', 'Limits of this picture', [h('div', { 'class': 'card limit', role: 'note' }, [
      h('div', { 'class': 'kind', text: '⚠ ' + (kinds[k] || 'Limitation') }), h('p', { text: str(L.text) })
    ])]);
  }

  function buildSource() {
    var paper = (S.paper && typeof S.paper === 'object') ? S.paper : {};
    var url = str(paper.url).trim();
    var safeUrl = /^https?:\/\//i.test(url) ? url : '';
    var cite = h('div', { 'class': 'cite' }, [
      paper.title ? h('strong', { text: str(paper.title) }) : h('strong', { text: 'Source paper not specified' }),
      paper.authors || paper.year ? h('div', { text: [str(paper.authors), paper.year ? '(' + str(paper.year) + ')' : ''].filter(Boolean).join(' ') }) : null,
      paper.section ? h('div', { text: 'Section: ' + str(paper.section) }) : null,
      safeUrl ? h('div', null, [h('a', { href: safeUrl, rel: 'noopener noreferrer', target: '_blank', text: safeUrl })]) : (url ? h('div', { text: url }) : null)
    ]);
    var notes = {
      inline: 'The agent was given an excerpt of the paper as text. Statements marked 📄 were written against that excerpt.',
      file: 'The agent read an excerpt of the paper from a local file. Statements marked 📄 were written against that excerpt.',
      fetched: 'The agent fetched text from the paper’s URL. Statements marked 📄 were written against that text.',
      none: 'No paper text was available to the agent, so nothing here is marked 📄. Content comes from the model’s knowledge of the cited paper and should be checked against the original.'
    };
    var claims = arr(S.claims).filter(function (c) { return c && c.text; });
    var list = claims.length ? h('ul', { 'class': 'claims' }, claims.map(function (c) {
      return h('li', null, [h('span', { text: str(c.text) }), h('span', null, badge(c.support))]);
    })) : h('p', { 'class': 'ctl-help', text: 'No individual claims were listed.' });
    var legend = h('div', { 'class': 'legend-badges', 'aria-label': 'Badge legend' }, [badge('excerpt') || badge('paper'), hasExcerpt ? badge('paper') : null, badge('illustration')]);
    return section('source', 'Source & grounding', [h('div', { 'class': 'card' }, [
      cite, h('p', { 'class': 'origin-note', text: notes[origin] || notes.none }),
      h('h3', { text: 'Claims on this page' }), list, legend
    ])]);
  }

  function resultClass(res) {
    var s = str(res).toLowerCase();
    if (s === 'pass' || s === 'ok' || s === 'passed' || s === 'true') return 'ok';
    if (s === 'fail' || s === 'error' || s === 'failed' || s === 'false') return 'bad';
    return 'skip';
  }
  function buildChecks() {
    var invList = h('ul', { 'class': 'checks' });
    invs.forEach(function (iv) {
      iv.mark = h('span', { 'class': 'mark skip', text: '–' });
      iv.detail = h('span', { 'class': 'detail' });
      iv.li = h('li', null, [iv.mark, h('span', null, [h('span', { text: iv.label }), h('code', { 'class': 'detail', text: iv.expr }), iv.detail])]);
      invList.append(iv.li);
    });
    els.invSummary = h('p', { 'class': 'summary-line' });
    var testsBox = null;
    var tests = arr(S.tests).filter(function (t) { return t && (t.expr || t.assert); });
    if (tests.length) {
      var tl = h('ul', { 'class': 'checks' });
      var passed = 0;
      tests.forEach(function (t) {
        var params = defaults();
        var tp = (t.params && typeof t.params === 'object') ? t.params : {};
        Object.keys(tp).forEach(function (k) { params[k] = byId[k] ? (coerce(byId[k], tp[k]) !== undefined ? coerce(byId[k], tp[k]) : tp[k]) : tp[k]; });
        var ok = false, detail = '';
        var c = compileExpr(t.expr || t.assert);
        if (c.err) detail = c.err;
        else {
          try { var r = callCompute(clone(params)); ok = !!c.fn(r, params); if (!ok) detail = 'assertion is false'; }
          catch (e) { detail = 'error: ' + errMsg(e); }
        }
        if (ok) passed += 1;
        tl.append(h('li', null, [h('span', { 'class': 'mark ' + (ok ? 'ok' : 'bad'), text: ok ? '✓' : '✗' }),
          h('span', null, [h('span', { text: str(t.name) || 'test' }), h('code', { 'class': 'detail', text: describePreset(tp) ? 'with ' + describePreset(tp) : 'with default settings' }), detail ? h('span', { 'class': 'detail', text: detail }) : null])]));
      });
      testsBox = h('div', null, [h('h3', { text: 'Worked-example tests (run in your browser at load)' }),
        h('p', { 'class': 'summary-line', text: passed + ' of ' + tests.length + ' pass.' }),
        h('p', { 'class': 'ctl-help', text: 'These are consistency checks written by the generator, not independent proof.' }), tl]);
    }
    var bchecks = arr(B.checks).filter(function (c) { return c && typeof c === 'object'; });
    var nOk = bchecks.filter(function (c) { return resultClass(c.result) === 'ok'; }).length;
    var nBad = bchecks.filter(function (c) { return resultClass(c.result) === 'bad'; }).length;
    var originText = { inline: 'excerpt given inline', file: 'excerpt read from a local file', fetched: 'text fetched from the paper URL', none: 'no paper text available' };
    var built = h('details', { 'class': 'built' }, [
      h('summary', { text: 'How this page was built and checked' + (bchecks.length ? ' (' + nOk + ' of ' + bchecks.length + ' automatic checks passed' + (nBad ? ', ' + nBad + ' failed' : '') + ')' : '') }),
      h('dl', null, [
        h('dt', { text: 'Generator model' }), h('dd', { text: str(B.model) || 'not recorded' }),
        h('dt', { text: 'Source text' }), h('dd', { text: originText[origin] || origin }),
        h('dt', { text: 'Generated at' }), h('dd', { text: str(B.generated_at) || 'not recorded' })
      ]),
      h('p', { 'class': 'ctl-help', text: 'An AI agent wrote the page content, the calculation and the drawing code; this fixed shell laid them out. Before the page was written, the code was executed automatically with the checks below.' }),
      bchecks.length ? h('ul', { 'class': 'checks' }, bchecks.map(function (c) {
        var cls = resultClass(c.result);
        return h('li', null, [h('span', { 'class': 'mark ' + cls, text: cls === 'ok' ? '✓' : (cls === 'bad' ? '✗' : '–') }),
          h('span', null, [h('strong', { text: str(c.id) }), ' ', h('span', { text: str(c.result) }), c.detail ? h('span', { 'class': 'detail', text: str(c.detail) }) : null])]);
      })) : h('p', { 'class': 'ctl-help', text: 'No build-check record was attached to this page.' })
    ]);
    return section('checks', 'Checks', [h('div', { 'class': 'card' }, [
      h('h3', { text: 'Live invariants (re-checked on every change)' }), els.invSummary, invList,
      testsBox, built
    ])]);
  }

  /* --------------------------------------------------------- wayfinding */
  /* Marks the section currently being read in the pinned nav (aria-current), and
     shows a soft edge under the bar only once content scrolls beneath it. */
  function spy(links, bar) {
    var ids = Object.keys(links);
    var cur = null;
    function mark(id) {
      if (id === cur) return;
      if (cur && links[cur]) { links[cur].removeAttribute('aria-current'); links[cur].classList.remove('cur'); }
      cur = id;
      var a = links[id];
      if (!a) return;
      a.setAttribute('aria-current', 'location'); a.classList.add('cur');
      var ul = a.parentNode && a.parentNode.parentNode;
      if (ul && ul.scrollWidth > ul.clientWidth + 1) {
        var l = a.offsetLeft - ul.offsetLeft, r = l + a.offsetWidth;
        if (l < ul.scrollLeft) ul.scrollLeft = Math.max(0, l - 16);
        else if (r > ul.scrollLeft + ul.clientWidth) ul.scrollLeft = r - ul.clientWidth + 16;
      }
    }
    function update() {
      var line = (bar ? bar.offsetHeight : 0) + Math.min(160, window.innerHeight * 0.3);
      var pick = ids.length ? ids[0] : null;
      for (var i = 0; i < ids.length; i++) {
        var el = document.getElementById(ids[i]);
        if (el && el.getBoundingClientRect().top <= line) pick = ids[i];
      }
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4 && ids.length) pick = ids[ids.length - 1];
      mark(pick);
      if (bar) bar.classList.toggle('stuck', bar.getBoundingClientRect().top <= 0.5 && window.scrollY > 0);
    }
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  /* ----------------------------------------------------------------- init */
  function init() {
    document.title = (str(S.title) || 'Interactive explainer') + ' · Paper to Playground';
    var head = buildHeader();
    var main = h('main', { 'class': 'wrap', id: 'main' });
    [buildIdea(), buildNotation(), buildPlayground(), buildExplore(), buildLimitation(), buildSource(), buildChecks()].forEach(function (s) { if (s) main.append(s); });
    var tocLinks = {};
    sections.forEach(function (s) {
      var a = h('a', { href: '#' + s.id, text: s.title });
      tocLinks[s.id] = a;
      head.toc.append(h('li', null, a));
    });
    var foot = h('footer', { 'class': 'site-foot wrap', text: 'Generated by Paper to Playground · a single offline page: everything runs in your browser.' });
    root.replaceChildren(head.el, head.bar, main, foot);
    run();
    try { spy(tocLinks, head.bar); } catch (e) { /* wayfinding is optional */ }
    if (location.hash && location.hash.length > 1) {
      var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) target.scrollIntoView();
    }
    var t = null;
    window.addEventListener('resize', function () {
      clearTimeout(t);
      t = setTimeout(function () { if (Math.abs(els.viz.clientWidth - lastWidth) > 24) run(); }, 160);
    });
    window.addEventListener('error', function (ev) {
      if (els.err && !els.err.classList.contains('on')) showError('render', ev.error || ev.message);
    });
  }
  try { init(); } catch (e) {
    root.replaceChildren(h('div', { 'class': 'wrap', style: 'padding:24px' }, [h('h1', { text: str(S.title) || 'Interactive explainer' }),
      h('p', { text: 'This page could not be assembled: ' + errMsg(e) }), S.idea ? h('p', { text: str(S.idea) }) : null]));
    try { console.error(e); } catch (x) { /* ignore */ }
  }
})();
